name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter (FVM-pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Check Dart formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_DART=$(git diff --name-only origin/main...HEAD | grep '^apps/mobile/.*\.dart$' || true)
          else
            CHANGED_DART=$(git diff --name-only HEAD~1 -- apps/mobile | grep '\.dart$' || true)
          fi
          if [ -z "$CHANGED_DART" ]; then
            echo "No changed Dart files; skipping format check."
          else
            echo "Checking formatting for:"
            echo "$CHANGED_DART"
            dart format --set-exit-if-changed $CHANGED_DART
          fi

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  backend:
    name: Backend (Node/Convex skeleton)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: pnpm install

      - name: Backend typecheck / lint placeholder
        run: |
          if [ -f tsconfig.json ]; then
            echo "tsconfig.json found; running tsc --noEmit"
            pnpm exec tsc --noEmit
          else
            echo "Backend skeleton: no tsconfig.json yet. Typecheck/lint deferred to S2 backend implementation."
          fi
